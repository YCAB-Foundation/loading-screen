<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YCAB Pulse — Sample Loading Screen</title>
  <script>
    if (window.self !== window.top) document.documentElement.dataset.frame = "1";
  </script>
  <script src="dist/ycab-loader.js"></script>
  <style>
    :root {
      --red: #ed1c24;
      --ink: #141414;
      --muted: #5c6570;
      --line: #e3e6eb;
      --page: #eceff3;
      --card: #ffffff;
      --light-stage: #fafafa;
      --dark-stage: #18181b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(237, 28, 36, 0.08), transparent 60%),
        var(--page);
    }

    .screen {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(20, 24, 32, 0.06);
    }

    .screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    .screen-head h1 {
      margin: 2px 0 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .back {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .back a { color: var(--muted); }

    .seg {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: #f1f3f6;
      border: 1px solid var(--line);
      flex: none;
    }

    .seg button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #4b5563;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .viewport {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 460px;
      padding: 28px 20px 32px;
      background:
        radial-gradient(720px 340px at 50% 42%, rgba(237, 28, 36, 0.14), transparent 58%),
        var(--light-stage);
      transition: background-color 0.35s ease;
      overflow: hidden;
    }

    .viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(113, 113, 122, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(113, 113, 122, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 12%, transparent 68%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 12%, transparent 68%);
      opacity: 0.75;
    }

    .screen[data-theme="dark"] .viewport {
      background:
        radial-gradient(720px 340px at 50% 42%, rgba(237, 28, 36, 0.22), transparent 58%),
        var(--dark-stage);
    }

    .screen[data-theme="dark"] .viewport::before {
      background-image:
        linear-gradient(rgba(161, 161, 170, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(161, 161, 170, 0.09) 1px, transparent 1px);
    }

    .viewport > * { position: relative; z-index: 1; }

    html[data-frame="1"] body {
      min-height: 0;
      padding: 0;
      display: block;
      background: transparent;
    }

    html[data-frame="1"] .screen { width: 100%; }
    html[data-frame="1"] .back { display: none; }
  </style>
</head>
<body>
  <main class="screen" id="screen" data-theme="light">
    <header class="screen-head">
      <div>
        <p class="kicker">Screen 4</p>
        <h1>YCAB Pulse</h1>
        <p class="back"><a href="index.html">Semua screen</a></p>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="light" aria-pressed="true">Light</button>
        <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <div class="viewport">
      <div>
        <ycab-loader id="loader" variant="pulse" theme="light"></ycab-loader>
      </div>
    </div>
  </main>

  <script>
    const screen = document.getElementById("screen");
    const loader = document.getElementById("loader");

    function applyTheme(mode) {
      if (mode !== "light" && mode !== "dark") return;
      screen.dataset.theme = mode;
      loader.setAttribute("theme", mode);
      screen.querySelectorAll(".seg button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
      });
    }

    screen.querySelectorAll(".seg button").forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.mode));
    });
  </script>
</body>
</html>
