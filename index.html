<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample Loading Screen</title>
  <style>
    :root {
      --ink: #141414;
      --muted: #5c6570;
      --page: #eceff3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(237, 28, 36, 0.08), transparent 60%),
        var(--page);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .page-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .page-head a { color: inherit; }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 22px;
    }

    .compare iframe {
      display: block;
      width: 100%;
      height: 540px;
      border: 0;
      background: transparent;
    }

    @media (max-width: 860px) {
      .compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Sample loading screen</h1>
    </header>

    <section class="compare">
      <iframe title="Screen 1, logo" data-src="logo.html"></iframe>
      <iframe title="Screen 2, ikon nilai" data-src="values.html" data-sync="steps"></iframe>
      <iframe title="Screen 3, I-SERVE" data-src="iserve.html" data-sync="steps"></iframe>
    </section>
  </main>

  <script>
    const start = Date.now();
    document.querySelectorAll("iframe[data-src]").forEach((frame) => {
      const url = new URL(frame.dataset.src, location.href);
      if (frame.dataset.sync === "steps") url.searchParams.set("start", String(start));
      frame.src = url.href;
    });
  </script>
</body>
</html>
