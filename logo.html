<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo — Sample Loading Screen</title>
  <script>
    if (window.self !== window.top) document.documentElement.dataset.frame = "1";
  </script>
  <style>
    :root {
      --red: #ed1c24;
      --ink: #141414;
      --muted: #5c6570;
      --line: #e3e6eb;
      --page: #eceff3;
      --card: #ffffff;
      --light-stage: #f4f5f7;
      --dark-stage: #0b0f17;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(237, 28, 36, 0.08), transparent 60%),
        var(--page);
    }

    .screen {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(20, 24, 32, 0.06);
    }

    .screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    .screen-head h1 {
      margin: 2px 0 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .back {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .back a { color: var(--muted); }

    .seg {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: #f1f3f6;
      border: 1px solid var(--line);
      flex: none;
    }

    .seg button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #4b5563;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 460px;
      padding: 28px 20px 32px;
      background: var(--light-stage);
      transition: background-color 0.35s ease;
    }

    .screen[data-theme="dark"] .viewport {
      background: var(--dark-stage);
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-box {
      position: relative;
      width: 300px;
      max-width: 100%;
      aspect-ratio: 540 / 480;
    }

    .logo-box img {
      position: absolute;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .wordmark {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .screen[data-theme="dark"] .wordmark {
      filter: brightness(0) invert(1);
    }

    .ornament {
      opacity: 0.3;
      transition: opacity 0.18s ease-out;
    }

    .ornament.is-active {
      opacity: 1;
    }

    .status {
      margin: 22px 0 0;
      font-size: 14px;
      font-weight: 650;
      color: #4d4d4d;
    }

    .screen[data-theme="dark"] .status {
      color: #e5e7eb;
    }

    html[data-frame="1"] body {
      min-height: 0;
      padding: 0;
      display: block;
      background: transparent;
    }

    html[data-frame="1"] .screen { width: 100%; }

    html[data-frame="1"] .back { display: none; }
  </style>
</head>
<body>
  <main class="screen" id="screen" data-theme="light">
    <header class="screen-head">
      <div>
        <p class="kicker">Screen 1</p>
        <h1>Logo</h1>
        <p class="back"><a href="index.html">Semua screen</a></p>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="light" aria-pressed="true">Light</button>
        <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <div class="viewport">
      <div class="loader" role="status" aria-live="polite" aria-label="Loading">
        <div class="logo-box" id="logo-box">
          <img class="wordmark" src="assets/wordmark.png" alt="" />
        </div>
        <p class="status">Loading…</p>
      </div>
    </div>
  </main>

  <script>
    const ORNAMENTS = [
      { name: "Panah/Rumah", src: "assets/ornament-01-panah-rumah.png", left: 15.193, top: 18.325, width: 16.703, height: 16.101 },
      { name: "Morph 1", src: "assets/ornament-02-morph-1.png", left: 31.897, top: 4.118, width: 20.065, height: 20.098 },
      { name: "Love Miring", src: "assets/ornament-03-love-miring.png", left: 58.065, top: 3.537, width: 23.945, height: 27.092 },
      { name: "Love Penuh", src: "assets/ornament-04-love-penuh.png", left: 66.303, top: 31.245, width: 32.963, height: 34.385 },
      { name: "Love Bawah", src: "assets/ornament-05-love-bawah.png", left: 60.472, top: 71.227, width: 25.624, height: 25.463 },
      { name: "Buku Bawah", src: "assets/ornament-06-buku-bawah.png", left: 38.404, top: 83.468, width: 19.147, height: 15.614 },
      { name: "Buku Kiri", src: "assets/ornament-07-buku-kiri.png", left: 19.657, top: 74.137, width: 16.383, height: 12.897 },
    ];

    const logoBox = document.getElementById("logo-box");
    ORNAMENTS.forEach((item) => {
      const img = document.createElement("img");
      img.className = "ornament";
      img.src = item.src;
      img.alt = "";
      img.title = item.name;
      img.style.left = item.left + "%";
      img.style.top = item.top + "%";
      img.style.width = item.width + "%";
      img.style.height = item.height + "%";
      logoBox.appendChild(img);
    });

    const ornamentNodes = [...logoBox.querySelectorAll(".ornament")];
    let activeOrnament = 0;
    function paintOrnament() {
      ornamentNodes.forEach((node, index) => {
        node.classList.toggle("is-active", index === activeOrnament);
      });
    }
    paintOrnament();
    setInterval(() => {
      activeOrnament = (activeOrnament + 1) % ornamentNodes.length;
      paintOrnament();
    }, 440);

    const screen = document.getElementById("screen");
    function applyTheme(mode) {
      if (mode !== "light" && mode !== "dark") return;
      screen.dataset.theme = mode;
      screen.querySelectorAll(".seg button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
      });
    }

    screen.querySelectorAll(".seg button").forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.mode));
    });
  </script>
</body>
</html>
