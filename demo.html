<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&lt;ycab-loader&gt; demo</title>
  <script src="dist/ycab-loader.js"></script>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #eceff3;
      color: #141414;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 14px; color: #5c6570; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin: 24px 0;
    }
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      padding: 24px;
      border-radius: 18px;
      background: #f4f5f7;
    }
    .stage.dark { background: #0b0f17; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid #d0d5dc; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>&lt;ycab-loader&gt;</h1>

    <div class="grid">
      <div><h2>variant="iserve"</h2><div class="stage"><ycab-loader variant="iserve"></ycab-loader></div></div>
      <div><h2>variant="values"</h2><div class="stage"><ycab-loader variant="values"></ycab-loader></div></div>
      <div><h2>variant="logo"</h2><div class="stage"><ycab-loader variant="logo"></ycab-loader></div></div>
    </div>

    <div class="actions">
      <select id="variant">
        <option value="iserve">iserve</option>
        <option value="values">values</option>
        <option value="logo">logo</option>
      </select>
      <select id="theme">
        <option value="light">light</option>
        <option value="dark">dark</option>
        <option value="auto">auto</option>
      </select>
      <button type="button" id="fullscreen">Fullscreen 3 detik</button>
    </div>

    <div class="grid">
      <div><h2>Live switch (ganti dropdown di atas)</h2><div class="stage" id="live-stage"><ycab-loader id="live"></ycab-loader></div></div>
    </div>
  </div>

  <script>
    const live = document.getElementById("live");
    const variant = document.getElementById("variant");
    const theme = document.getElementById("theme");
    const stage = document.getElementById("live-stage");

    function sync() {
      live.setAttribute("variant", variant.value);
      live.setAttribute("theme", theme.value);
      stage.classList.toggle("dark", live.dataset.theme === "dark");
    }
    variant.addEventListener("change", sync);
    theme.addEventListener("change", sync);
    sync();

    document.getElementById("fullscreen").addEventListener("click", () => {
      YCABLoader.wrap(new Promise((resolve) => setTimeout(resolve, 3000)), {
        variant: variant.value,
        theme: theme.value,
      });
    });
  </script>
</body>
</html>
